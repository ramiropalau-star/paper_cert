{% if can_review %}
<details class="teach-alias">
  <summary>Enseñar alias</summary>
  <form method="post" action="{% url 'documents:teach_alias' document.pk %}" class="inline-form">
    {% csrf_token %}
    <input type="hidden" name="field" value="{{ alias_field }}">
    <input type="text" name="alias" placeholder="Etiqueta tal como aparece en el certificado" required>
    {% if certificate.entity_id %}
      <select name="scope" aria-label="Alcance del alias">
        <option value="global">Global</option>
        <option value="entity">Solo {{ certificate.entity.name }}</option>
      </select>
    {% endif %}
    <button type="submit" class="link-button">Guardar</button>
  </form>
</details>
{% endif %}
