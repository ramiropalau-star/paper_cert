{% if can_review %}
<details class="teach-alias">
  <summary>Enseñar alias</summary>
  <div class="inline-form">
    <input type="hidden" name="field" value="{{ alias_field }}" form="teach-{{ document.pk }}-{{ alias_field }}">
    <input type="text" name="alias" placeholder="Etiqueta tal como aparece en el certificado" required form="teach-{{ document.pk }}-{{ alias_field }}">
    {% if certificate.entity_id %}
      <select name="scope" aria-label="Alcance del alias" form="teach-{{ document.pk }}-{{ alias_field }}">
        <option value="global">Global</option>
        <option value="entity">Solo {{ certificate.entity.name }}</option>
      </select>
    {% endif %}
    <button type="submit" class="link-button" form="teach-{{ document.pk }}-{{ alias_field }}">Guardar</button>
  </div>
</details>
{% endif %}
