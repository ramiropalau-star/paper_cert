{% extends "base.html" %}
{% block title %}Nueva contraseña{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Elegí una nueva contraseña</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Guardar contraseña</button>
      </form>
    {% else %}
      <p class="form-error">El enlace es inválido o expiró. Solicitá uno nuevo.</p>
      <p><a href="{% url 'password_reset' %}">Solicitar nuevo enlace</a></p>
    {% endif %}
  </section>
{% endblock %}
