{% extends "base.html" %}
{% block title %}Restablecer contraseña{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Restablecer contraseña</h1>
    <p>Ingresá tu nombre de usuario y te enviaremos un enlace para restablecerla.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button">Enviar enlace</button>
    </form>
  </section>
{% endblock %}
