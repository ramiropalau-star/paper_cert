{% extends "base.html" %}
{% block title %}Ingresar · Certificados de idiomas{% endblock %}
{% block content %}
  <section class="panel narrow">
    <h1>Ingresar</h1>
    {% if form.errors %}
      <p class="form-error">Usuario o contraseña incorrectos.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <p>
        <label for="id_username">Usuario</label>
        <input id="id_username" name="username" autocomplete="username" required autofocus>
      </p>
      <p>
        <label for="id_password">Contraseña</label>
        <input id="id_password" name="password" type="password" autocomplete="current-password" required>
      </p>
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit" class="button">Ingresar</button>
    </form>
  </section>
{% endblock %}
